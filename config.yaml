device:
  device_id: edge-001
  school_id: 1
  default_camera_index: 0   # Câmera padrão (notebook); fallback quando índice escolhido falha
  camera_connect_timeout_seconds: 10  # RTSP Intelbras: dar mais tempo para conectar

cameras:
  # Intelbras — desligada para teste local com webcam (senha ainda placeholder)
  - camera_id: cam-vip-5440-01
    room_id: SALA_TECH
    rtsp_url: rtsp://admin:PASSWORD@192.168.100.133:554/cam/realmonitor?channel=1&subtype=1
    enabled: false

  # Webcam do notebook. Índice 0 neste PC entrega frame PRETO; use "1".
  # Se falhar, teste "0" ou "2" (Iriun/USB).
  - camera_id: cam-web
    room_id: DEV
    rtsp_url: "1"
    webcam_width: 1280
    webcam_height: 720
    enabled: true

  # DVR Intelbras (canal 10) — outro equipamento na rede
  - camera_id: cam-sala-tech
    room_id: SALA_TECH
    rtsp_url: rtsp://admin:PASSWORD@192.168.100.240:554/cam/realmonitor?channel=10&subtype=0
    enabled: false

  # Segunda câmera (opcional): descomente se quiser notebook + USB ao mesmo tempo (mais CPU)
  # - camera_id: cam-usb1080
  #   room_id: DEV
  #   rtsp_url: "0"
  #   webcam_width: 1920
  #   webcam_height: 1080
  #   enabled: true

vision:
  # Produção sala ~30 alunos: YuNet + embeddings (onnx no Ryzen se DLL ok).
  # Integração 5 projetos: ver docs/ROADMAP.md e docs/ARCHITECTURE.md
  detector: yunet            # yunet | auto | dnn | insightface | full_range | short_range
  embedder: facenet          # facenet | onnx (recomendado CPU) | insightface
  max_faces: 30
  dnn_conf_threshold: 0.35   # só se detector: dnn ou auto com fallback
  yunet_score_threshold: 0.45   # DVR/teto: scores baixos são normais; suba se muitos falsos na parede
  min_face_area_ratio: 0.0005   # rostos pequenos no stream do DVR
  face_aspect_min: 0.45         # bbox mais largo/estreito (ângulo de cima)
  face_aspect_max: 1.55
  single_subject_mode: false    # false = várias faces; true = só a maior
  insightface_det_size: 960
  insightface_min_det_score: 0.50
  mediapipe_min_confidence: 0.55

  presence:
    sampling_seconds: 2
    threshold: 0.70
    match_margin: 0.10   # maior = exige mais diferença entre 1º e 2º aluno (menos troca Ester/Emerson)
    th_on: 0.75          # histerese: reconhece acima deste valor
    th_off: 0.68         # histerese: só volta a "desconhecido" abaixo deste valor
    track_ttl_seconds: 2.5   # tracker: mantém caixa estável entre frames
    max_templates_per_student: 7   # multi-template (óculos/sem): até N por aluno
    min_face_size: 22         # DVR 2MP / rosto longe (subir se muitos falsos)
    always_on: true   # dev: presença 24h; prod: false + active_windows
    active_windows:
      - start: "07:00"
        end: "07:20"
      - start: "13:00"
        end: "13:20"
    dedup_mode: day  # day | shift | class

  engagement:
    backend: hybrid           # hybrid = pose + expressão aparente (teste local)
    sampling_seconds: 2
    window_seconds: 10
    model_version: eng-v2-hybrid

  climate:
    use_fer: true             # clima agregado com FER se o modelo estiver disponível
    window_seconds: 15

  behavioral:
    enabled: true            # sinais observáveis + agregador temporal

  phone_yolo:
    enabled: false           # expansão; requer ultralytics + pesos
    model_path: ""

# Cadastro por webcam: mais frames = mais precisão (média de embeddings)
enrollment:
  num_frames: 20           # Frames a capturar (ex.: 15–20 para máxima precisão)
  frames_used: 12          # Top N melhores usados para calcular a média (ex.: 8–12)
  capture_duration_seconds: 5.0   # Tempo em segundos para captura

sync:
  batch_size: 10
  retry_attempts: 3
  retry_backoff_seconds: 5
  sync_interval_seconds: 10

# Backup (DAT): embeddings + fila; criptografia via env BACKUP_PASSPHRASE
backup:
  dir: ./data/backups   # pen drive: ex. D:/backups

logging:
  level: INFO
  format: json

# Runtime: demo | offline | rtsp
# Para testar com SUA webcam, use rtsp (ou webcam local via cam-web).
runtime:
  mode: rtsp

experimental:
  sqlite_005_enabled: false
  longitudinal_approval_recorded: false

# Modos: disabled | debug | shadow | production
# Inferência real: máx. shadow até aprovação longitudinal. Em demo os módulos aparecem como "demo".
modules:
  expression: { mode: debug }
  face_landmarks: { mode: debug }
  person_tracking: { mode: debug }
  phone: { mode: debug }
  pose: { mode: debug }
  temporal_fusion: { mode: debug }
  educational_dashboard: { mode: production }
  lxp: { mode: disabled }

expression:
  provider: fer_legacy
  interval_seconds: 1.0
  window_seconds: 8
  minimum_samples: 4
  minimum_confidence: 0.60
  minimum_observation_quality: 0.55

analytics:
  quality_interval_seconds: 0.5
  landmarks_interval_seconds: 0.5

visual_attention:
  window_seconds: 10
  minimum_samples: 5
  minimum_observation_quality: 0.55

drowsiness:
  possible_after_seconds: 6
  probable_after_seconds: 10
  eye_closed_ratio_threshold: 0.70
  minimum_observation_quality: 0.60
  cooldown_seconds: 20

provenance:
  rule_engine_version: rules-v0-baseline
  threshold_profile: presence-yaml-2026-07-23
  camera_calibration_version: cam-vip-5440-01-uncalibrated

privacy:
  store_raw_video: false
  store_review_evidence: false
  evidence_retention_hours: 24
  blur_non_target_faces: true
  demo_db_path: ./data/demo/dulino_edge_demo.db
