# config.yaml — default de desenvolvimento / experimentos
# Entrega TRI (FER+ ONNX): use o overlay config.tri.yaml
#   $env:PRESENCA_CONFIG_OVERLAY = "config.tri.yaml"
# Não altere o provider abaixo só para a entrega — preserve HSEmotion experimental.

device:
  device_id: edge-001
  school_id: 1
  default_camera_index: 0   # só usado se allow_index_fallback=true (desligado por padrão)
  camera_connect_timeout_seconds: 10  # RTSP Intelbras: dar mais tempo para conectar

cameras:
  # Intelbras — desligada para teste local com webcam (senha ainda placeholder)
  - camera_id: cam-vip-5440-01
    room_id: SALA_TECH
    rtsp_url: rtsp://admin:PASSWORD@192.168.100.133:554/cam/realmonitor?channel=1&subtype=1
    enabled: false

  # USB 1080p: "auto" escolhe frame com imagem real + maior resolução.
  # Cuidado: Iriun Webcam (virtual) pode aparecer como 1080p PRETA sem o celular.
  # Alternativa fixa: "0", "1", "2"… Confira /cameras/devices?as_html=1 (uvicorn parado).
  - camera_id: cam-web
    room_id: DEV
    rtsp_url: "auto"
    webcam_width: 1920
    webcam_height: 1080
    enabled: true

  # DVR Intelbras (canal 10) — outro equipamento na rede
  - camera_id: cam-sala-tech
    room_id: SALA_TECH
    rtsp_url: rtsp://admin:PASSWORD@192.168.100.240:554/cam/realmonitor?channel=10&subtype=0
    enabled: false

  # Segunda câmera (opcional): descomente se quiser notebook + USB ao mesmo tempo (mais CPU)
  # - camera_id: cam-usb1080
  #   room_id: DEV
  #   rtsp_url: "0"
  #   webcam_width: 1920
  #   webcam_height: 1080
  #   enabled: true

vision:
  # Produção sala ~30 alunos: YuNet + embeddings (onnx no Ryzen se DLL ok).
  # Integração 5 projetos: ver docs/ROADMAP.md e docs/ARCHITECTURE.md
  detector: yunet            # yunet | auto | dnn | insightface | full_range | short_range
  embedder: facenet          # facenet | onnx (recomendado CPU) | insightface
  max_faces: 30
  dnn_conf_threshold: 0.35   # só se detector: dnn ou auto com fallback
  yunet_score_threshold: 0.45   # DVR/teto: scores baixos são normais; suba se muitos falsos na parede
  min_face_area_ratio: 0.0005   # rostos pequenos no stream do DVR
  face_aspect_min: 0.45         # bbox mais largo/estreito (ângulo de cima)
  face_aspect_max: 1.55
  single_subject_mode: false    # false = várias faces; true = só a maior
  insightface_det_size: 960
  insightface_min_det_score: 0.50
  mediapipe_min_confidence: 0.55

  presence:
    sampling_seconds: 2
    threshold: 0.70
    match_margin: 0.10   # maior = exige mais diferença entre 1º e 2º aluno (menos troca Ester/Emerson)
    th_on: 0.75          # histerese: reconhece acima deste valor
    th_off: 0.68         # histerese: só volta a "desconhecido" abaixo deste valor
    track_ttl_seconds: 2.5   # tracker: mantém caixa estável entre frames
    max_templates_per_student: 7   # multi-template (óculos/sem): até N por aluno
    min_face_size: 22         # DVR 2MP / rosto longe (subir se muitos falsos)
    always_on: true   # dev: presença 24h; prod: false + active_windows
    active_windows:
      - start: "07:00"
        end: "07:20"
      - start: "13:00"
        end: "13:20"
    dedup_mode: day  # day | shift | class

  engagement:
    backend: hybrid           # hybrid = pose + expressão aparente (teste local)
    sampling_seconds: 2
    window_seconds: 10
    model_version: eng-v2-hybrid

  climate:
    use_fer: true             # clima agregado com FER se o modelo estiver disponível
    window_seconds: 15

  behavioral:
    enabled: true            # sinais observáveis + agregador temporal

  phone_yolo:
    enabled: true            # YOLO cell phone (ultralytics); nunca confirmed automático
    model_path: "data/models/yolov8n.pt"
    conf_threshold: 0.42     # frame completo — calibrar com amostras
    max_height_width_ratio: 2.7  # rejeita garrafa/térmico alto (FP comum)
    max_width_height_ratio: 4.0  # aceita celular deitado no peito (largo)
    torso_pass_enabled: true     # 2ª passagem no recorte do tórax (celular no peito)
    torso_conf_threshold: 0.30   # conf mais baixa só no ROI do peito

# Cadastro por webcam: mais frames = mais precisão (média de embeddings)
enrollment:
  num_frames: 20           # Frames a capturar (ex.: 15–20 para máxima precisão)
  frames_used: 12          # Top N melhores usados para calcular a média (ex.: 8–12)
  capture_duration_seconds: 5.0   # Tempo em segundos para captura

sync:
  batch_size: 10
  retry_attempts: 3
  retry_backoff_seconds: 5
  sync_interval_seconds: 10

# Backup (DAT): embeddings + fila; criptografia via env BACKUP_PASSPHRASE
backup:
  dir: ./data/backups   # pen drive: ex. D:/backups

logging:
  level: INFO
  format: json

# Runtime: demo | offline | rtsp
# Para testar com SUA webcam, use rtsp (ou webcam local via cam-web).
runtime:
  mode: rtsp

experimental:
  sqlite_005_enabled: false
  longitudinal_approval_recorded: false
  perclos_enabled: false
  perclos_window_seconds: 60
  perclos_min_coverage: 0.50

# Modos: disabled | debug | shadow | production
# Inferência real: máx. shadow até aprovação longitudinal. Em demo os módulos aparecem como "demo".
modules:
  expression: { mode: debug }
  face_landmarks: { mode: debug }
  person_tracking: { mode: debug }
  phone: { mode: debug }
  pose: { mode: debug }
  temporal_fusion: { mode: debug }
  educational_dashboard: { mode: production }
  lxp: { mode: disabled }

expression:
  provider: hsemotion
  # A/B DeepFace desligado: enviesava "positiva". TRI usa config.tri.yaml → fer_onnx.
  ab_secondary: null
  # fer_onnx entra se HSEmotion falhar (pesos corrompidos / torch) — caso atual no edge.
  fallback_chain: [hsemotion, fer_onnx, fer_legacy]
  interval_seconds: 1.0
  window_seconds: 8
  minimum_samples: 3
  minimum_confidence: 0.45
  minimum_confidence_positive: 0.50
  minimum_confidence_negative: 0.42
  minimum_negative_samples: 2
  # Reativado: FER+ ONNX erra sorriso→neutral; ver TROUBLESHOOTING + config.tri.yaml
  smile_boost_enabled: true
  frown_boost_enabled: true
  minimum_observation_quality: 0.55

analytics:
  quality_interval_seconds: 0.5
  landmarks_interval_seconds: 0.5

# Person-first (analytics). Não altera thresholds de presença FaceNet.
# face_missing_ttl_seconds = idade da confirmação facial (stale UI/decay facial).
# NÃO expira identidade nem força uncertain sozinho — ver body_continuity.
identity_binding:
  face_missing_ttl_seconds: 12  # face_confirmation_stale_seconds (semântica)
  minimum_new_identity_confidence: 0.75
  minimum_identity_margin: 0.10   # só se top1/top2 reais no runtime
  confirmations_before_switch: 3
  identity_switch_cooldown_seconds: 10
  confidence_decay_per_second: 0.04  # só face_confirmation_confidence
  body_continuity_uncertain_threshold: 0.45
  temporarily_lost_uncertain_seconds: 4.0

person_tracking:
  enabled: true
  prefer_bytetrack: true
  model_path: data/models/yolov8n.pt
  # Continuidade corporal (segundos). Independente da confirmação facial (12s).
  ttl_seconds: 8.0
  max_time_lost_seconds: 8.0          # tracks fortes (conf ≥ 0.45)
  weak_max_time_lost_seconds: 2.0     # detecções fracas / fantasmas YOLO → expiram rápido
  minimum_detection_confidence: 0.40  # reduz caixas vazias (parede/porta)
  minimum_reassociation_iou: 0.30
  maximum_center_distance_ratio: 0.35
  bytetrack_yaml: data/trackers/bytetrack_person.yaml

face_occlusion:
  wrist_near_ratio: 0.65          # punho perto do rosto (face diag.) — evita FP headset/mic
  confirm_seconds: 0.7             # exige punho perto antes de contar oclusão
  clear_hold_seconds: 4.0          # mantém oclusão ~4s mesmo com flicker de pose (era 0.5)
  face_missing_hold_seconds: 15.0  # rosto sumido (mão cobrindo): hold longo — punho some atrás da mão
  persistent_seconds: 5.0          # evento persistente só após 5s reais
  suppress_when_landmarks_clear: true  # só limpa se SEM evidência de punho recente

behavioral_events:
  clear_hold_seconds: 0.5          # base: fecha rápido ao normalizar
  clear_hold_drowsiness_seconds: 4.0  # olhos/celular: evita N episódios por piscar

head_down:
  pitch_threshold: 0.45            # ~40° (pitch normalizado / π/2); DMS tipicamente 20–40°
  event_min_seconds: 8.0            # evento após N segundos acumulados
  short_to_persistent_seconds: 8.0  # alinha "prolongada" ao evento (não 2.5s)
  require_landmarks_quality: 0.45   # visibility gate: sem landmarks OK → sem pitch
  suppress_when_occlusion: true     # punho/mão na cara → oclusão ganha de head_down
  allow_face_missing_proxy: false   # rosto sumiu ≠ cabeça baixa (evita FP com mão)
  inconclusive_hold_seconds: 12.0   # continuidade look-down extremo (anti fragmentação)

pose_body:
  enabled: true
  model_path: data/mediapipe_models/pose_landmarker_lite.task

phone:
  possible_after_seconds: 5
  probable_after_seconds: 12
  interaction_requires_in_hand: true  # possible/probable só com punho perto do bbox

visual_attention:
  window_seconds: 10
  minimum_samples: 5
  minimum_observation_quality: 0.55

drowsiness:
  possible_after_seconds: 6
  probable_after_seconds: 30   # olhos fechados sozinhos ≥30s → probable
  eye_closed_ear_threshold: 0.18  # EAR runtime (fonte única)
  # eye_closed_ratio_threshold: deprecated — não usado pelo motor RT
  minimum_observation_quality: 0.60
  cooldown_seconds: 20
  observation_gap_inconclusive_seconds: 8

provenance:
  rule_engine_version: rules-v0-baseline
  threshold_profile: presence-yaml-2026-07-23
  camera_calibration_version: cam-vip-5440-01-uncalibrated

privacy:
  store_raw_video: false
  store_review_evidence: false
  evidence_retention_hours: 24
  blur_non_target_faces: true
  demo_db_path: ./data/demo/dulino_edge_demo.db
