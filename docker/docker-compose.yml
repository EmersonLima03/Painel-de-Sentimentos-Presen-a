version: '3.8'

services:
  dulino-edge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dulino-edge-vision
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env:ro
      - ../config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dulino-network

networks:
  dulino-network:
    driver: bridge
