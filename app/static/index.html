<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulino Edge Vision - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status.ok {
            background: #10b981;
            color: white;
        }
        
        .status.error {
            background: #ef4444;
            color: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #6b7280;
        }
        
        .stat-value {
            font-weight: bold;
            color: #1f2937;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .json-view {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Dulino Edge Vision</h1>
            <span class="status ok" id="appStatus">Carregando...</span>
            <p style="margin-top: 10px; color: #6b7280;">Sistema de processamento de vídeo RTSP em edge</p>
        </header>
        
        <div class="grid">
            <div class="card">
                <h2>📊 Health Check</h2>
                <div id="healthContent">
                    <div class="loading">Carregando...</div>
                </div>
                <button class="refresh-btn" onclick="loadHealth()">🔄 Atualizar</button>
            </div>
            
            <div class="card">
                <h2>📈 Estatísticas</h2>
                <div id="statsContent">
                    <div class="loading">Carregando...</div>
                </div>
                <button class="refresh-btn" onclick="loadStats()">🔄 Atualizar</button>
            </div>
            
            <div class="card">
                <h2>📹 Câmeras</h2>
                <div id="camerasContent">
                    <div class="loading">Carregando...</div>
                </div>
                <button class="refresh-btn" onclick="loadCameras()">🔄 Atualizar</button>
            </div>
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>📋 JSON Raw (Debug)</h2>
            <div class="json-view" id="jsonView">
                Aguardando dados...
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        async function fetchJSON(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Erro ao buscar:', error);
                return { error: error.message };
            }
        }
        
        function formatNumber(num) {
            return num?.toLocaleString('pt-BR') || '0';
        }
        
        function formatTime(seconds) {
            if (!seconds) return '0s';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }
        
        async function loadHealth() {
            const content = document.getElementById('healthContent');
            content.innerHTML = '<div class="loading">Carregando...</div>';
            
            const data = await fetchJSON('/health');
            
            if (data.error) {
                content.innerHTML = `<div class="error">Erro: ${data.error}</div>`;
                return;
            }
            
            const statusEl = document.getElementById('appStatus');
            if (data.status === 'ok') {
                statusEl.textContent = '✅ Online';
                statusEl.className = 'status ok';
            } else {
                statusEl.textContent = '❌ Erro';
                statusEl.className = 'status error';
            }
            
            content.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Versão:</span>
                    <span class="stat-value">${data.version || 'N/A'}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo Ativo:</span>
                    <span class="stat-value">${formatTime(data.uptime_seconds)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Câmeras Online:</span>
                    <span class="stat-value">${data.cameras_online || 0} / ${data.cameras_total || 0}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Modo Simulação:</span>
                    <span class="stat-value">${data.simulation_mode ? '✅ Sim' : '❌ Não'}</span>
                </div>
            `;
            
            updateJSONView(data);
        }
        
        async function loadStats() {
            const content = document.getElementById('statsContent');
            content.innerHTML = '<div class="loading">Carregando...</div>';
            
            const data = await fetchJSON('/stats');
            
            if (data.error) {
                content.innerHTML = `<div class="error">Erro: ${data.error}</div>`;
                return;
            }
            
            const events = data.events || {};
            const orch = data.orchestrator || {};
            
            content.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Total de Eventos:</span>
                    <span class="stat-value">${formatNumber(events.total || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pendentes:</span>
                    <span class="stat-value">${formatNumber(events.pending || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Enviados:</span>
                    <span class="stat-value">${formatNumber(events.sent || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Falhas:</span>
                    <span class="stat-value">${formatNumber(events.failed || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Orchestrator:</span>
                    <span class="stat-value">${orch.running ? '✅ Rodando' : '❌ Parado'}</span>
                </div>
            `;
            
            updateJSONView(data);
        }
        
        async function loadCameras() {
            const content = document.getElementById('camerasContent');
            content.innerHTML = '<div class="loading">Carregando...</div>';
            
            const data = await fetchJSON('/cameras');
            
            if (data.error) {
                content.innerHTML = `<div class="error">Erro: ${data.error}</div>`;
                return;
            }
            
            const cameras = data.cameras || {};
            const cameraList = Object.keys(cameras);
            
            if (cameraList.length === 0) {
                content.innerHTML = '<p style="color: #6b7280;">Nenhuma câmera configurada</p>';
                return;
            }
            
            let html = '';
            cameraList.forEach(camId => {
                const cam = cameras[camId];
                const status = cam.is_connected ? '✅ Online' : '❌ Offline';
                html += `
                    <div class="stat-item">
                        <span class="stat-label">${camId}:</span>
                        <span class="stat-value">${status}</span>
                    </div>
                `;
            });
            
            content.innerHTML = html || '<p style="color: #6b7280;">Nenhuma câmera encontrada</p>';
            updateJSONView(data);
        }
        
        function updateJSONView(data) {
            document.getElementById('jsonView').textContent = JSON.stringify(data, null, 2);
        }
        
        // Carregar tudo ao iniciar
        window.addEventListener('load', () => {
            loadHealth();
            loadStats();
            loadCameras();
            
            // Auto-refresh a cada 5 segundos
            setInterval(() => {
                loadHealth();
                loadStats();
                loadCameras();
            }, 5000);
        });
    </script>
</body>
</html>
